name: Release

# Al pushear un tag vX.Y.Z: compila el front y publica un release con dist.zip.
# La infra puede bajar ese dist.zip en vez de compilar (opcional; el pipeline de
# infra tambien sabe compilar este repo directo).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Empaquetar dist
        run: cd dist && zip -r ../dist.zip . && cd ..
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: dist.zip
          generate_release_notes: true
